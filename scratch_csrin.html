<style>
body {
    text-align: center;
    font-family: Verdana, Helvetica, Arial, sans-serif;
    background-color: #000000;
    color: #CCCCCC;
}

a {
    color: #AAAAAA;
}

a:hover {
    color: #FFFFFF;
}
</style>
</head>
<body>
    <script nonce="343ad728d31e6a7a03f32c85af18780e">
    window.onload = function() {
        var s = document.createElement('p');
        s.innerHTML = 'Security check, please wait..';
        document.body.appendChild(s);

        if (location.hostname !== "cs.rin.ru")
        {
            // Prevent Tor2web and other unauthorized reverse proxies
            var p = document.createElement('p');
            p.innerHTML = 'Unauthorized domain ' + location.hostname;
            document.body.appendChild(p);
            return;
        }

        // Set security token cookie and start cookie persistence check
        var newURL = location.href;
        document.cookie = "securitytoken=uRPNeeOB51dNWh4yKYvSoA; path=/; secure";
        document.cookie = "securitytoken_expiration=1778502015; path=/; secure";
		newURL = newURL.replace(location.pathname, "/securitycheck" + location.pathname);
        location.replace(newURL);
    };
    </script>
    <noscript>
	    <h1>401 Unauthorized</h1>
